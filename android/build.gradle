// android/build.gradle
buildscript {
  ext {
    compileSdkVersion = 35
    targetSdkVersion  = 35
    minSdkVersion     = 24
    kotlin_version    = '1.9.24'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
    classpath "com.google.gms:google-services:4.4.4"
    // ❌ (삭제) com.facebook.react:react-native-gradle-plugin
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url("$rootDir/../node_modules/react-native/android") }
    maven { url("$rootDir/../node_modules/jsc-android/dist") }
    maven { url("https://jitpack.io") }
  }
  configurations.all { cfg ->
    cfg.exclude group: "com.facebook.fbjni", module: "fbjni-java-only"
  }
}

subprojects { project ->
  plugins.withId('com.android.library') {
    android {
      compileSdk rootProject.ext.compileSdkVersion as Integer
      defaultConfig {
        minSdk    rootProject.ext.minSdkVersion as Integer
        targetSdk rootProject.ext.targetSdkVersion as Integer
      }
      buildFeatures { prefab true }
    }
  }
}