// android/settings.gradle

pluginManagement {
  includeBuild("../node_modules/@react-native/gradle-plugin")
  repositories {
    gradlePluginPortal()
    mavenCentral()
    google()
    maven { url("$rootDir/../node_modules/react-native/android") }
  }
}

plugins {
  id "com.facebook.react.settings"       // ✅ RN settings plugin
  id "de.undercouch.download" version "5.6.0" apply false
}

rootProject.name = "deepfake_detection_service_application"
include(":app")