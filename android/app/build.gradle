plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  // ✅ 앱 모듈에서 React 플러그인(여기가 react { } 블록의 자리)
  id 'com.facebook.react'
}

react {
  // node 경로 필요 시 여기에만 둡니다 (settings.gradle 에 두지 말 것)
  nodeExecutableAndArgs = ["node"]
}

android {
  namespace "com.deepfake_detection_service_application"
  compileSdkVersion rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.deepfake_detection_service_application"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  ndkVersion "26.1.10909125"
  buildFeatures { prefab true }
  packagingOptions { jniLibs { useLegacyPackaging true } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("com.facebook.fbjni:fbjni:0.7.0")
  implementation "org.pytorch:pytorch_android_lite:1.13.1"
}

configurations.all {
  resolutionStrategy.force "com.facebook.fbjni:fbjni:0.7.0"
  exclude group: "com.facebook.fbjni", module: "fbjni-java-only"
}