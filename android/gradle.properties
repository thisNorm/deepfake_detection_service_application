# ===========================
# Gradle / JVM
# ===========================
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.memory.limit=3072m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
# 프로젝트가 병렬 빌드에 안전한 경우에만 켜세요
# org.gradle.parallel=true
# Gradle 경고를 보고 싶으면
# org.gradle.warning.mode=all

# ===========================
# AndroidX / Jetifier
# ===========================
android.useAndroidX=true
android.enableJetifier=true

# ===========================
# Kotlin
# ===========================
kotlin.code.style=official
kotlin.incremental=true
kotlin.jvm.target=17
kotlin_version=1.9.24

# ===========================
# React Native
# ===========================
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
hermesEnabled=true

# 빌드 성능/안정 옵션 (AGP 8.x 호환)
android.nonTransitiveRClass=true

reactNative.nodeExecutableAndArgs=/opt/homebrew/bin/node

# ===========================
# 🔐 Keystore (보안상 여기에 직접 두지 마세요)
#   => 아래 4개 값은 '로컬 전용' 파일로 이동하세요:
#      1) ~/.gradle/gradle.properties  (개인 PC 전용)
#      2) 또는 android/keystore.properties (VCS 제외 .gitignore)
#
# 예시(로컬 전용 파일에만 넣기):
# MYAPP_UPLOAD_STORE_FILE=my-release-key.keystore
# MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
# MYAPP_UPLOAD_STORE_PASSWORD=********
# MYAPP_UPLOAD_KEY_PASSWORD=********
#
# 현재 노출된 값은 반드시 교체/폐기하세요.